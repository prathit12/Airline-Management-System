<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Management - Airline Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-plane"></i> Airline Management System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/menu">Main Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/customers">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/airports">Airports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/flights">Flights</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/bookings">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/payments">Payments</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        <h4><i class="fas fa-credit-card"></i> Payment Management</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Search Section -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="searchPayment" placeholder="Enter payment number to search">
                                    <button class="btn btn-info" onclick="searchPayment()">
                                        <i class="fas fa-search"></i> Search
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-success" onclick="loadAllPayments()">
                                    <i class="fas fa-list"></i> Load All Payments
                                </button>
                                <button class="btn btn-primary" onclick="showAddPaymentForm()">
                                    <i class="fas fa-plus"></i> Add Payment
                                </button>
                            </div>
                        </div>

                        <!-- Add Payment Form -->
                        <div id="addPaymentForm" class="card mb-3" style="display: none;">
                            <div class="card-header bg-success text-white">
                                <h5>Add New Payment</h5>
                            </div>
                            <div class="card-body">
                                <form id="paymentForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Payment Number</label>
                                                <input type="text" class="form-control" id="paymentNumber" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Booking Number</label>
                                                <input type="text" class="form-control" id="bookingNumber" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Amount Paid</label>
                                                <input type="number" step="0.01" class="form-control" id="amountPaid" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Payment Date</label>
                                                <input type="date" class="form-control" id="paymentDate" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Payment Method</label>
                                                <select class="form-control" id="paymentMethod" required>
                                                    <option value="">Select Method</option>
                                                    <option value="Credit Card">Credit Card</option>
                                                    <option value="Debit Card">Debit Card</option>
                                                    <option value="Cash">Cash</option>
                                                    <option value="Bank Transfer">Bank Transfer</option>
                                                    <option value="PayPal">PayPal</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success">Save Payment</button>
                                    <button type="button" class="btn btn-secondary" onclick="hideAddPaymentForm()">Cancel</button>
                                </form>
                            </div>
                        </div>

                        <!-- Payments Table -->
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Payment Number</th>
                                        <th>Booking Number</th>
                                        <th>Amount Paid</th>
                                        <th>Payment Date</th>
                                        <th>Method</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center">Click "Load All Payments" to view data</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadAllPayments() {
            authenticatedFetch('/api/payments')
                .then(response => response.json())
                .then(data => {
                    displayPayments(data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading payments');
                });
        }

        function searchPayment() {
            const paymentNumber = document.getElementById('searchPayment').value;
            if (!paymentNumber) {
                alert('Please enter a payment number');
                return;
            }

            authenticatedFetch(`/api/payments/${paymentNumber}`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Payment not found');
                    }
                })
                .then(data => {
                    displayPayments([data]);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Payment not found');
                });
        }

        function displayPayments(payments) {
            const tbody = document.getElementById('paymentTableBody');
            tbody.innerHTML = '';

            payments.forEach(payment => {
                const row = `
                    <tr>
                        <td>${payment.paymentNumber}</td>
                        <td>${payment.booking ? payment.booking.bookingId : 'N/A'}</td>
                        <td>$${payment.amountPaid.toFixed(2)}</td>
                        <td>${payment.paymentDate}</td>
                        <td>${payment.paymentMethod}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deletePayment('${payment.paymentNumber}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function showAddPaymentForm() {
            document.getElementById('addPaymentForm').style.display = 'block';
        }

        function hideAddPaymentForm() {
            document.getElementById('addPaymentForm').style.display = 'none';
            document.getElementById('paymentForm').reset();
        }

        document.getElementById('paymentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const paymentData = {
                payment_number: document.getElementById('paymentNumber').value,
                booking_number: document.getElementById('bookingNumber').value,
                amount_paid: parseFloat(document.getElementById('amountPaid').value),
                payment_date: document.getElementById('paymentDate').value,
                method: document.getElementById('paymentMethod').value
            };

            authenticatedFetch('/api/payments', {
                method: 'POST',
                body: JSON.stringify(paymentData)
            })
            .then(response => response.json())
            .then(data => {
                alert('Payment added successfully!');
                hideAddPaymentForm();
                loadAllPayments();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding payment');
            });
        });

        function deletePayment(paymentNumber) {
            if (confirm(`Are you sure you want to delete payment ${paymentNumber}?`)) {
                authenticatedFetch(`/api/payments/${paymentNumber}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Payment deleted successfully!');
                        loadAllPayments();
                    } else {
                        throw new Error('Error deleting payment');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting payment');
                });
            }
        }
    </script>
</body>
</html>
