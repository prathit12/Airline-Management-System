<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - Airline Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="card">
            <div class="card-header">
                <h4>API Frontend Test</h4>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <h5>1. Login Test</h5>
                    <button class="btn btn-primary" onclick="testLogin()">Test Login</button>
                    <div id="loginResult" class="mt-2"></div>
                </div>
                
                <div class="mb-3">
                    <h5>2. Payments API Test</h5>
                    <button class="btn btn-success" onclick="testPayments()">Test Payments</button>
                    <div id="paymentsResult" class="mt-2"></div>
                </div>
                
                <div class="mb-3">
                    <h5>3. Bookings API Test</h5>
                    <button class="btn btn-info" onclick="testBookings()">Test Bookings</button>
                    <div id="bookingsResult" class="mt-2"></div>
                </div>
                
                <div class="mb-3">
                    <h5>4. Dashboard Stats Test</h5>
                    <button class="btn btn-warning" onclick="testDashboardStats()">Test Dashboard Stats</button>
                    <div id="statsResult" class="mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        let authToken = null;
        
        async function testLogin() {
            const loginResult = document.getElementById('loginResult');
            loginResult.innerHTML = '<div class="text-info">Testing login...</div>';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        usernameOrEmail: 'admin',
                        password: 'admin123'
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    authToken = data.accessToken;
                    localStorage.setItem('authToken', authToken);
                    loginResult.innerHTML = `<div class="alert alert-success">✅ Login successful! User: ${data.username}</div>`;
                } else {
                    loginResult.innerHTML = `<div class="alert alert-danger">❌ Login failed: ${data.message}</div>`;
                }
            } catch (error) {
                loginResult.innerHTML = `<div class="alert alert-danger">❌ Login error: ${error.message}</div>`;
            }
        }
        
        async function testPayments() {
            const paymentsResult = document.getElementById('paymentsResult');
            paymentsResult.innerHTML = '<div class="text-info">Testing payments API...</div>';
            
            try {
                const response = await authenticatedFetch('/api/payments');
                const data = await response.json();
                
                if (response.ok) {
                    paymentsResult.innerHTML = `<div class="alert alert-success">✅ Payments loaded: ${data.length} payments found</div>`;
                } else {
                    paymentsResult.innerHTML = `<div class="alert alert-danger">❌ Payments failed: ${data.message}</div>`;
                }
            } catch (error) {
                paymentsResult.innerHTML = `<div class="alert alert-danger">❌ Payments error: ${error.message}</div>`;
            }
        }
        
        async function testBookings() {
            const bookingsResult = document.getElementById('bookingsResult');
            bookingsResult.innerHTML = '<div class="text-info">Testing bookings API...</div>';
            
            try {
                const response = await authenticatedFetch('/bookings');
                const data = await response.json();
                
                if (response.ok) {
                    bookingsResult.innerHTML = `<div class="alert alert-success">✅ Bookings loaded: ${data.length} bookings found</div>`;
                } else {
                    bookingsResult.innerHTML = `<div class="alert alert-danger">❌ Bookings failed: ${data.message}</div>`;
                }
            } catch (error) {
                bookingsResult.innerHTML = `<div class="alert alert-danger">❌ Bookings error: ${error.message}</div>`;
            }
        }
        
        async function testDashboardStats() {
            const statsResult = document.getElementById('statsResult');
            statsResult.innerHTML = '<div class="text-info">Testing dashboard stats...</div>';
            
            try {
                // Test multiple endpoints like the dashboard does
                const [customersResp, flightsResp, bookingsResp, paymentsResp] = await Promise.all([
                    authenticatedFetch('/customers'),
                    authenticatedFetch('/flights'),
                    authenticatedFetch('/bookings'),
                    authenticatedFetch('/api/payments')
                ]);
                
                const [customers, flights, bookings, payments] = await Promise.all([
                    customersResp.json(),
                    flightsResp.json(),
                    bookingsResp.json(),
                    paymentsResp.json()
                ]);
                
                const totalRevenue = payments.reduce((sum, payment) => sum + payment.amountPaid, 0);
                
                statsResult.innerHTML = `
                    <div class="alert alert-success">
                        ✅ Dashboard stats loaded:<br>
                        • Customers: ${customers.length}<br>
                        • Flights: ${flights.length}<br>
                        • Bookings: ${bookings.length}<br>
                        • Payments: ${payments.length}<br>
                        • Total Revenue: $${totalRevenue.toFixed(2)}
                    </div>`;
            } catch (error) {
                statsResult.innerHTML = `<div class="alert alert-danger">❌ Stats error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
