<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Management - Airline Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-plane"></i> Airline Management System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/menu">Main Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/customers">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/airports">Airports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/flights">Flights</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/bookings">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/payments">Payments</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-warning text-dark">
                        <h4><i class="fas fa-ticket-alt"></i> Booking Management</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Search Section -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="searchBooking" placeholder="Enter booking number to search">
                                    <button class="btn btn-info" onclick="searchBooking()">
                                        <i class="fas fa-search"></i> Search
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-success" onclick="loadAllBookings()">
                                    <i class="fas fa-list"></i> Load All Bookings
                                </button>
                                <button class="btn btn-primary" onclick="showAddBookingForm()">
                                    <i class="fas fa-plus"></i> Add Booking
                                </button>
                            </div>
                        </div>

                        <!-- Add Booking Form -->
                        <div id="addBookingForm" class="card mb-3" style="display: none;">
                            <div class="card-header bg-success text-white">
                                <h5>Add New Booking</h5>
                            </div>
                            <div class="card-body">
                                <form id="bookingForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Booking Number</label>
                                                <input type="text" class="form-control" id="bookingNumber" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Flight Number</label>
                                                <input type="text" class="form-control" id="flightNumber" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Customer Number</label>
                                                <input type="text" class="form-control" id="customerNumber" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Travel Date</label>
                                                <input type="date" class="form-control" id="travelDate" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Seat Number</label>
                                                <input type="text" class="form-control" id="seatNumber" required>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success">Save Booking</button>
                                    <button type="button" class="btn btn-secondary" onclick="hideAddBookingForm()">Cancel</button>
                                </form>
                            </div>
                        </div>

                        <!-- Bookings Table -->
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Booking Number</th>
                                        <th>Flight Number</th>
                                        <th>Customer Number</th>
                                        <th>Travel Date</th>
                                        <th>Seat Number</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="bookingTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center">Click "Load All Bookings" to view data</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadAllBookings() {
            authenticatedFetch('/bookings')
                .then(response => response.json())
                .then(data => {
                    displayBookings(data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading bookings');
                });
        }

        function searchBooking() {
            const bookingNumber = document.getElementById('searchBooking').value;
            if (!bookingNumber) {
                alert('Please enter a booking number');
                return;
            }

            authenticatedFetch(`/bookings/${bookingNumber}`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Booking not found');
                    }
                })
                .then(data => {
                    displayBookings([data]);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Booking not found');
                });
        }

        function displayBookings(bookings) {
            const tbody = document.getElementById('bookingTableBody');
            tbody.innerHTML = '';

            bookings.forEach(booking => {
                const row = `
                    <tr>
                        <td>${booking.bookingNumber}</td>
                        <td>${booking.flight ? booking.flight.flightId : 'N/A'}</td>
                        <td>${booking.customer ? booking.customer.customerId : 'N/A'}</td>
                        <td>${booking.travelDate}</td>
                        <td>${booking.seatNumber}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteBooking('${booking.bookingNumber}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function showAddBookingForm() {
            document.getElementById('addBookingForm').style.display = 'block';
        }

        function hideAddBookingForm() {
            document.getElementById('addBookingForm').style.display = 'none';
            document.getElementById('bookingForm').reset();
        }

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const bookingData = {
                booking_number: document.getElementById('bookingNumber').value,
                flight_number: document.getElementById('flightNumber').value,
                customer_number: document.getElementById('customerNumber').value,
                travel_date: document.getElementById('travelDate').value,
                seat_number: document.getElementById('seatNumber').value
            };

            authenticatedFetch('/bookings', {
                method: 'POST',
                body: JSON.stringify(bookingData)
            })
            .then(response => response.json())
            .then(data => {
                alert('Booking added successfully!');
                hideAddBookingForm();
                loadAllBookings();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding booking');
            });
        });

        function deleteBooking(bookingNumber) {
            if (confirm(`Are you sure you want to delete booking ${bookingNumber}?`)) {
                authenticatedFetch(`/bookings/${bookingNumber}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Booking deleted successfully!');
                        loadAllBookings();
                    } else {
                        throw new Error('Error deleting booking');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting booking');
                });
            }
        }
    </script>
</body>
</html>
