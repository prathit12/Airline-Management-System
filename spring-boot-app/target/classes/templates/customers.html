<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Airline Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-plane"></i> Airline Management System
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/menu">Main Menu</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ui/customers">Customers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/airports">Airports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/flights">Flights</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/bookings">Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ui/payments">Payments</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4><i class="fas fa-users"></i> Customer Management</h4>
                    </div>
                    <div class="card-body">
                        
                        <!-- Search Section -->
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="searchCustomer" placeholder="Enter customer number to search">
                                    <button class="btn btn-info" onclick="searchCustomer()">
                                        <i class="fas fa-search"></i> Search
                                    </button>
                                </div>
                            </div>
                            <div class="col-md-6 text-end">
                                <button class="btn btn-success" onclick="loadAllCustomers()">
                                    <i class="fas fa-list"></i> Load All Customers
                                </button>
                                <button class="btn btn-primary" onclick="showAddCustomerForm()">
                                    <i class="fas fa-plus"></i> Add Customer
                                </button>
                            </div>
                        </div>

                        <!-- Add Customer Form (Hidden by default) -->
                        <div id="addCustomerForm" class="card mb-3" style="display: none;">
                            <div class="card-header bg-success text-white">
                                <h5>Add New Customer</h5>
                            </div>
                            <div class="card-body">
                                <form id="customerForm">
                                    <div class="row">
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Customer Number</label>
                                                <input type="text" class="form-control" id="customerNumber" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Customer Name</label>
                                                <input type="text" class="form-control" id="customerName" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Email</label>
                                                <input type="email" class="form-control" id="customerEmail" required>
                                            </div>
                                        </div>
                                        <div class="col-md-6">
                                            <div class="mb-3">
                                                <label class="form-label">Phone Number</label>
                                                <input type="text" class="form-control" id="customerPhone" required>
                                            </div>
                                            <div class="mb-3">
                                                <label class="form-label">Address</label>
                                                <textarea class="form-control" id="customerAddress" rows="3" required></textarea>
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-success">Save Customer</button>
                                    <button type="button" class="btn btn-secondary" onclick="hideAddCustomerForm()">Cancel</button>
                                </form>
                            </div>
                        </div>

                        <!-- Search Result -->
                        <div id="searchResult" style="display: none;"></div>

                        <!-- Customers Table -->
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Customer Number</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Phone</th>
                                        <th>Address</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="customerTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center">Click "Load All Customers" to view data</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load all customers
        function loadAllCustomers() {
            fetch('/customers')
                .then(response => response.json())
                .then(data => {
                    displayCustomers(data);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error loading customers');
                });
        }

        // Search customer by number
        function searchCustomer() {
            const customerNumber = document.getElementById('searchCustomer').value;
            if (!customerNumber) {
                alert('Please enter a customer number');
                return;
            }

            fetch(`/customers/${customerNumber}`)
                .then(response => {
                    if (response.ok) {
                        return response.json();
                    } else {
                        throw new Error('Customer not found');
                    }
                })
                .then(data => {
                    displayCustomers([data]);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Customer not found');
                });
        }

        // Display customers in table
        function displayCustomers(customers) {
            const tbody = document.getElementById('customerTableBody');
            tbody.innerHTML = '';

            customers.forEach(customer => {
                const row = `
                    <tr>
                        <td>${customer.customer_number}</td>
                        <td>${customer.customer_name}</td>
                        <td>${customer.email}</td>
                        <td>${customer.tel_num}</td>
                        <td>${customer.address}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteCustomer('${customer.customer_number}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Show/hide add customer form
        function showAddCustomerForm() {
            document.getElementById('addCustomerForm').style.display = 'block';
        }

        function hideAddCustomerForm() {
            document.getElementById('addCustomerForm').style.display = 'none';
            document.getElementById('customerForm').reset();
        }

        // Add customer form submission
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const customerData = {
                customer_number: document.getElementById('customerNumber').value,
                customer_name: document.getElementById('customerName').value,
                email: document.getElementById('customerEmail').value,
                tel_num: document.getElementById('customerPhone').value,
                address: document.getElementById('customerAddress').value
            };

            fetch('/customers', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(customerData)
            })
            .then(response => response.json())
            .then(data => {
                alert('Customer added successfully!');
                hideAddCustomerForm();
                loadAllCustomers();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error adding customer');
            });
        });

        // Delete customer
        function deleteCustomer(customerNumber) {
            if (confirm(`Are you sure you want to delete customer ${customerNumber}?`)) {
                fetch(`/customers/${customerNumber}`, {
                    method: 'DELETE'
                })
                .then(response => {
                    if (response.ok) {
                        alert('Customer deleted successfully!');
                        loadAllCustomers();
                    } else {
                        throw new Error('Error deleting customer');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Error deleting customer');
                });
            }
        }
    </script>
</body>
</html>
